spring.application.name=eda-choreography-engine

# Kafka clients are declared in infra.kafka.KafkaConfig (no Boot Kafka auto-configuration).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Where an instance is reported once it has run its last step.
choreography.kafka.completed-topic=choreography.completed

# Redis — used from INC-4.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

logging.level.com.eda.choreography=INFO
logging.level.org.springframework.kafka=WARN
