spring.application.name=eda-choreography-engine

# Kafka clients are declared in infra.kafka.KafkaConfig (no Boot Kafka auto-configuration).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Where an instance is reported once it has run its last step.
choreography.kafka.completed-topic=choreography.completed
# Where an instance is reported once every completed step has been undone.
choreography.kafka.compensated-topic=choreography.compensated
# Where a compensation request is parked when its step could not be undone, for an operator.
choreography.kafka.compensation-failed-topic=choreography.compensation-failed

# Join state lives in Redis.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
# How long join state is kept after its last change. It matches Kafka's default topic
# retention (7 days), the longest a branch can still be redelivered.
choreography.join.state-ttl=7d
# How often each engine looks for joins whose wait is over.
choreography.join.sweep-interval=1s

logging.level.com.eda.choreography=INFO
logging.level.org.springframework.kafka=WARN
