name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: mvn verify (unit + container ITs)
    runs-on: ubuntu-latest   # ships with Docker, which Testcontainers needs from INC-3 on
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  # Once main is verified, its image goes to the GitHub Container Registry, tagged with the
  # commit and as latest. The deploy stack pins the commit tag.
  publish:
    name: publish the engine image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package (already verified above)
        run: mvn -B --no-transfer-progress package -DskipTests

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ermi9/eda-choreography:${{ github.sha }}
            ghcr.io/ermi9/eda-choreography:latest
