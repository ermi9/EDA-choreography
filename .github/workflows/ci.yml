name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: mvn verify (unit + container ITs)
    runs-on: ubuntu-latest   # ships with Docker, which Testcontainers needs from INC-3 on
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
